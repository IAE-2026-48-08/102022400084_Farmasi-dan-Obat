services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 102022400084_Farmasi-dan-Obat
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "php artisan key:generate --force && php artisan migrate --force && php artisan clear-compiled && php artisan optimize:clear && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
      - /var/www/bootstrap/cache
  
  vite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_vite
    restart: unless-stopped
    working_dir: /var/www
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www
      - /var/www/node_modules
      - /var/www/bootstrap/cache